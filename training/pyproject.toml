[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pearl-training"
version = "1.0.0"
description = "Concept-conditioned retrieval and evidence-grounded PEARL training"
requires-python = ">=3.11"
dependencies = [
  "torch==2.9.0",
  "transformers==4.57.5",
  "accelerate==1.12.0",
  "peft==0.18.1",
  "qwen-vl-utils==0.0.14",
  "requests>=2.32,<3",
  "Pillow>=11,<13",
  "numpy>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pearl-generate = "pearl_training.generate:main"
pearl-train-sft = "pearl_training.train_sft:main"
pearl-train-retrieval = "pearl_training.train_retrieval:main"
